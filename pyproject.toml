[project]
name = "sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alekseyfagimovv", email = "alekseyfagimovv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.5.0",
    "pytest-playwright>=0.10.0",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
sandbox = "sandbox:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
package = false
